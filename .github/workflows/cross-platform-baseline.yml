# CP-04 CI honesty skeleton.
# Required-green tooling proves install, architecture, portable root scripts,
# typecheck, and build on all three OS runners. POSIX product tests run in their
# own required job. Windows secure-state/product tests remain a separate
# non-blocking known-gap until the native backend is implemented.
# No signing, secrets, or release promotion.

name: Cross-platform baseline

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  FORCE_COLOR: "0"

jobs:
  tooling:
    name: tooling ${{ matrix.os }} Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["22.19.x", "24.12.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install
        run: npm ci
      - name: Architecture
        run: npm run check:architecture
      - name: Portable root script tests
        run: node scripts/run-node-test.mjs "scripts/**/*.test.mjs"
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Diff whitespace
        run: git diff --check

  posix-product-tests:
    name: product tests ${{ matrix.os }} Node 22.19.x
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.x"
          cache: npm
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Diff whitespace
        run: git diff --check

  windows-product-known-gap:
    name: windows product known-gap (non-blocking)
    runs-on: windows-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.x"
          cache: npm
      - name: Install
        run: npm ci
      - name: Build CLI/sessiond needed for the product entry
        run: npm run build --workspace @fffattiger/pix-sessiond --workspace @fffattiger/pix-cli
      - name: Prove the current Windows sessiond startup failure contract
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $output = & node packages/cli/bin/pix-sessiond.mjs 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $output
          if ($code -eq 0) {
            Write-Error "Windows product smoke unexpectedly succeeded; move this seam into the required tooling job instead of inventing a known-gap pass."
            exit 1
          }
          if ($output -notmatch "sessiond private directory path is invalid") {
            Write-Error "Windows product smoke failed, but not with the frozen private-directory contract. Update CP-04 after diagnosing the new failure."
            exit 1
          }
          if ($output -match "WSL") {
            Write-Error "Windows product diagnostic must not recommend WSL."
            exit 1
          }
          Write-Host "Known gap confirmed: native Windows sessiond still fails closed before named-pipe bind."
