# CP-04 CI honesty skeleton.
# Required-green tooling proves install, architecture, portable root scripts,
# typecheck, and build on all three OS runners. POSIX product tests run in their
# own required job. Windows sessiond now has a required start/shutdown smoke
# after the native secure-state backend; remaining Windows product gaps stay
# out of this job.
# No signing, secrets, or release promotion.

name: Cross-platform baseline

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  FORCE_COLOR: "0"

jobs:
  tooling:
    name: tooling ${{ matrix.os }} Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["22.19.x", "24.12.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install
        run: npm ci
      - name: Architecture
        run: npm run check:architecture
      - name: Portable root script tests
        run: node scripts/run-node-test.mjs "scripts/**/*.test.mjs"
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Windows native load smoke
        if: runner.os == 'Windows'
        run: node scripts/run-node-test.mjs "packages/local-authority/test/windows-native.test.mjs"
      - name: Diff whitespace
        run: git diff --check

  posix-product-tests:
    name: product tests ${{ matrix.os }} Node 22.19.x
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.x"
          cache: npm
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Diff whitespace
        run: git diff --check

  windows-sessiond-smoke:
    name: windows sessiond start/shutdown smoke
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.x"
          cache: npm
      - name: Install
        run: npm ci
      - name: Build sessiond test surface
        run: npm run build:test --workspace @fffattiger/pix-sessiond
      - name: Start and stop a dedicated Windows sessiond
        run: node scripts/run-node-test.mjs --test-name-pattern="Windows sessiond can start" "packages/sessiond/dist-test/test/private-dir-daemon.test.js"
