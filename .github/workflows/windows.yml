name: windows

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - name: Script tests
        run: node scripts/run-node-test.mjs "scripts/**/*.test.mjs" "tests/e2e/helpers/*.test.mjs"
      - name: Workspace unit tests
        run: node scripts/ci-run-workspace-tests.mjs test
      - name: Startup smoke (real sessiond over a named pipe + host)
        run: node tests/windows-smoke.mjs
