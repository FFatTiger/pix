name: windows

# One build, then every workspace test in its own job so a hung package
# cannot hide or delay the others. `needs: build` makes the workflow fail
# when any job fails. Each test job is capped; node --test also caps a
# single test so a stuck case fails that job instead of waiting it out.
#
# The test jobs do NOT reuse the build job's node_modules: npm creates
# workspace junctions there, and any archive round-trip (7z, tar) breaks
# them, so `@fffattiger/pix-*` resolution dies with "Cannot find module".
# Instead each job runs its own `npm ci` (junctions rebuilt natively) and
# only downloads the compiled `packages/*/dist` trees — plain files — from
# the build job. A package's own `npm test` rebuilds its dist anyway; the
# overlay supplies the OTHER packages' dist its imports resolve to.

on:
  workflow_dispatch:
  push:
    branches: [main, "ci/**"]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      # `packages/*/dist` only: regular files, no junctions. The artifact
      # stores each tree as `<package>/dist/...`, so a download straight
      # into `packages/` lands it back in place.
      - uses: actions/upload-artifact@v4
        with:
          name: windows-dists
          path: packages/*/dist
          if-no-files-found: error
          retention-days: 1

  test:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: "@fffattiger/pix-agent-worker"
          - package: "@fffattiger/pix-cli"
          - package: "@fffattiger/pix-client"
          - package: "@fffattiger/pix-cross-package-contract-tests"
          - package: "@fffattiger/pix-host"
          - package: "@fffattiger/pix-local-authority"
          - package: "@fffattiger/pix-pi-sdk-adapter"
          - package: "@fffattiger/pix-protocol"
          - package: "@fffattiger/pix-runtime-contract-tests"
          - package: "@fffattiger/pix-runtime-core"
          - package: "@fffattiger/pix-sessiond"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: windows-dists
          path: packages
      # Per-test timeout is the runner default (scripts/run-node-test.mjs,
      # 120s). npm would not forward a bare --test-timeout to that runner.
      - name: Unit tests
        run: npm test --workspace "${{ matrix.package }}"

  scripts:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: windows-dists
          path: packages
      # Through npm: the release-package tests require npm_execpath.
      - name: Script tests
        run: npm run test:scripts

  smoke:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: windows-dists
          path: packages
      - name: Startup smoke (real sessiond over a named pipe + host)
        run: node tests/windows-smoke.mjs
