<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1a1a1a" />
    <meta
      name="description"
      content="Local web interface for the pi coding agent"
    />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>pix</title>
    <script>
      // Pre-paint bootstrap ported from the upstream desktop app layout:
      // theme / wallpaper / language / font-scale before first paint.
      // Adds a one-time migration of the legacy pix "pix-theme" key to "pi-theme-mode".
      (function(){try{var px=localStorage.getItem("pix-theme");if(px==="light"||px==="dark"){if(!localStorage.getItem("pi-theme-mode")){localStorage.setItem("pi-theme-mode",px)}localStorage.removeItem("pix-theme")}var h=document.documentElement,m=localStorage.getItem("pi-theme-mode")||"dark",t=localStorage.getItem("pi-theme")||"",q=localStorage.getItem("pi-locale"),g=localStorage.getItem("pi-language"),l=q||g,r=m;if(!q&&g){localStorage.setItem("pi-locale",g);localStorage.removeItem("pi-language")}if(!l){var n=(navigator.languages&&navigator.languages[0])||navigator.language||"";if(/^zh(?:-|$)/i.test(n))l="zh-CN"}if(!t){var od=localStorage.getItem("pi-theme-dark"),ol=localStorage.getItem("pi-theme-light");if(od){t=od.replace(/-dark$/i,"");try{localStorage.setItem("pi-theme",t);localStorage.removeItem("pi-theme-dark");localStorage.removeItem("pi-theme-light")}catch(e){}}else if(ol){t=ol.replace(/-light$/i,"");try{localStorage.setItem("pi-theme",t);localStorage.removeItem("pi-theme-dark");localStorage.removeItem("pi-theme-light")}catch(e){}}}var fs=parseFloat(localStorage.getItem("pi-font-scale"));if(!isNaN(fs)&&fs>=0.8&&fs<=1.5){h.style.setProperty("--app-ui-scale",String(Math.round(fs*100)/100))}if(m==="system"){r=window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"}if(r==="dark")h.classList.add("dark");if(t){h.dataset.theme=t}h.dataset.themeMode=m;h.dataset.themeResolvedMode=r;var wpe=localStorage.getItem("pi-wallpaper-enabled"),wps=localStorage.getItem("pi-wallpaper-scrim");if(wpe!=="0"){var sc=parseFloat(wps);if(isNaN(sc)){sc=70}else{sc=Math.min(95,Math.max(30,Math.round(sc)))}h.dataset.wallpaper="on";h.style.setProperty("--wallpaper-scrim",sc+"%");var wI=localStorage.getItem("pi-wallpaper-input"),wM=localStorage.getItem("pi-wallpaper-message"),wP=localStorage.getItem("pi-wallpaper-panel");h.dataset.wallpaperInput=(wI==="none"||wI==="trans"||wI==="blur")?wI:"blur";h.dataset.wallpaperMessage=(wM==="none"||wM==="trans"||wM==="blur")?wM:"none";h.dataset.wallpaperPanel=(wP==="none"||wP==="trans"||wP==="blur")?wP:"none"}if(l==="zh-CN"){h.lang=l;h.dataset.language=l}else{h.lang="en";h.dataset.language="en"}}catch(e){var n=(navigator.languages&&navigator.languages[0])||navigator.language||"";h.lang=/^zh(?:-|$)/i.test(n)?"zh-CN":"en";h.dataset.language=h.lang}})();
    </script>
  </head>
  <body
    style="
      height: calc(100dvh / var(--app-ui-scale, 1));
      display: flex;
      flex-direction: column;
    "
  >
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
